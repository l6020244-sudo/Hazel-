    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
          // --- 分享功能激活咒语 ---
const btnShare = document.getElementById('btn-share');
if (btnShare) {
    btnShare.addEventListener('click', async () => {
        // 准备分享的数据
        const shareData = {
            title: '纠结打分器 | 拒绝内耗，逻辑拍板',
            text: '我刚用这个超酷的波普风打分器做了一个决定，你也来试试？',
            url: window.location.href // 自动抓取当前网页地址
        };

        try {
            // 尝试调用系统原生分享 (手机端最爽)
            if (navigator.share) {
                await navigator.share(shareData);
            } else {
                // 电脑端或不支持 Share API 的浏览器：执行“复制到剪贴板”
                await navigator.clipboard.writeText(window.location.href);
                
                // 弹出一个波普风的提示 (这里借用 alert，你也可以以后做成漂亮的 Toast)
                alert("🔗 链接已复制到剪贴板，快去发给朋友吧！");
            }
        } catch (err) {
            console.log('分享取消或失败', err);
        }
    });
}
            const sceneConfigs = {
                '1': { 
                    labels: ['视觉吸引力', '专属稀缺度', '情绪价值'], 
                    activeColorClass: 'bg-pink-400', hoverColorClass: 'hover:bg-pink-400',
                    explanation: '🎁 (手办、追星、游戏充值、谷子等)'
                },
                '2': { 
                    labels: ['颜值与质感', '核心性能', '保值回血率'], 
                    activeColorClass: 'bg-blue-400', hoverColorClass: 'hover:bg-blue-400',
                    explanation: '💻 (手机数码、相机镜头、家用电器、高值首饰等)'
                },
                '3': { 
                    labels: ['短期反馈感受', '长期回报', '消耗精力量'], 
                    activeColorClass: 'bg-emerald-400', hoverColorClass: 'hover:bg-emerald-400',
                    explanation: '📚 (教育报班、职业考证、技能培训、自律计划等)'
                }
            };

            const sceneBtns = document.querySelectorAll('.scene-btn');
            const weightInputs = document.querySelectorAll('.input-weight');
            const scoreInputs = document.querySelectorAll('.input-score');
            const weightTotalLabel = document.getElementById('weight-total-label');
            const btnGenerate = document.getElementById('btn-generate');
            const btnResets = document.querySelectorAll('.btn-reset');
            const sceneExplanation = document.getElementById('scene-explanation');
            
            const btnToggleC = document.getElementById('btn-toggle-c');
            const optionCCols = document.querySelectorAll('.option-c-col');
            const iconPlus = document.getElementById('icon-plus');
            const iconMinus = document.getElementById('icon-minus');
            let isOptionCVisible = false;

            let myRadarChart = null;

            function switchScene(sceneId) {
                const config = sceneConfigs[sceneId];
                if (!config) return;

                sceneBtns.forEach(btn => {
                    btn.classList.remove('bg-pink-400', 'bg-blue-400', 'bg-emerald-400', 'bg-gray-100', 'font-black', 'font-bold', 'shadow-neo', 'transform', '-translate-y-1', 'hover:bg-pink-400', 'hover:bg-blue-400', 'hover:bg-emerald-400');
                    if (btn.dataset.scene === sceneId) {
                        btn.classList.add(config.activeColorClass, 'font-black', 'shadow-neo', 'transform', '-translate-y-1');
                    } else {
                        const targetConfig = sceneConfigs[btn.dataset.scene];
                        btn.classList.add('bg-gray-100', 'font-bold', targetConfig.hoverColorClass, 'hover:shadow-neo', 'hover:-translate-y-1');
                    }
                });

                const labels = document.querySelectorAll('.dimension-row:not(.hidden) .label-dimension');
                for (let i = 0; i < 3; i++) {
                    if (labels[i]) labels[i].textContent = config.labels[i];
                }

                if (sceneExplanation) {
                    sceneExplanation.textContent = config.explanation;
                }
            }

            sceneBtns.forEach(btn => btn.addEventListener('click', (e) => switchScene(e.target.dataset.scene)));

            function calculateWeight() {
                let total = 0;
                for (let i = 0; i < 3; i++) {
                    total += parseInt(weightInputs[i].value) || 0;
                }

                weightTotalLabel.textContent = `权重总和: ${total}%`;

                if (total === 100) {
                    weightTotalLabel.classList.remove('bg-red-400', 'text-white');
                    weightTotalLabel.classList.add('bg-lime-400', 'text-black');
                    btnGenerate.disabled = false;
                    btnGenerate.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed', 'shadow-none', 'transform-none');
                    btnGenerate.classList.add('bg-purple-500', 'text-white', 'hover:translate-y-1', 'hover:shadow-neo', 'shadow-neo-lg');
                } else {
                    weightTotalLabel.classList.remove('bg-lime-400', 'text-black');
                    weightTotalLabel.classList.add('bg-red-400', 'text-white');
                    btnGenerate.disabled = true;
                    btnGenerate.classList.remove('bg-purple-500', 'text-white', 'hover:translate-y-1', 'hover:shadow-neo', 'shadow-neo-lg');
                    btnGenerate.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed', 'shadow-none', 'transform-none');
                }
            }

            weightInputs.forEach((input, index) => {
                if(index < 3) input.addEventListener('input', calculateWeight);
            });

            scoreInputs.forEach(input => {
                input.addEventListener('input', (e) => {
                    e.target.classList.remove('!border-red-500', '!bg-red-100', 'placeholder-red-400');
                    if (e.target.value === '') return;
                    let val = parseFloat(e.target.value);
                    if (val > 10) e.target.value = 10;
                    if (val < 0) e.target.value = 0;
                    if (e.target.value.includes('.')) {
                        let parts = e.target.value.split('.');
                        if (parts[1].length > 1) {
                            e.target.value = parseFloat(val).toFixed(1);
                        }
                    }
                });
            });

            btnToggleC.addEventListener('click', () => {
                isOptionCVisible = !isOptionCVisible;
                if (isOptionCVisible) {
                    optionCCols.forEach(col => col.classList.remove('hidden'));
                    iconPlus.classList.add('hidden');
                    iconMinus.classList.remove('hidden');
                    btnToggleC.classList.remove('text-gray-400', 'hover:bg-lime-300', 'border-gray-400');
                    btnToggleC.classList.add('text-black', 'hover:bg-red-400', 'bg-gray-200', 'border-black');
                } else {
                    optionCCols.forEach(col => {
                        col.classList.add('hidden');
                        const input = col.querySelector('input');
                        if (input) {
                            input.value = '';
                            input.classList.remove('!border-red-500', '!bg-red-100', 'placeholder-red-400');
                        }
                    });
                    iconPlus.classList.remove('hidden');
                    iconMinus.classList.add('hidden');
                    btnToggleC.classList.remove('text-black', 'hover:bg-red-400', 'bg-gray-200', 'border-black');
                    btnToggleC.classList.add('text-gray-400', 'hover:bg-lime-300', 'border-gray-400');
                }
            });

            btnGenerate.addEventListener('click', () => {
                if (btnGenerate.disabled) return;

                let isValid = true;
                const activeRows = document.querySelectorAll('.dimension-row:not(.hidden)');
                const dimensions = [];
                const scoresA = [], scoresB = [], scoresC = [];
                const weights = [];

                activeRows.forEach(row => {
                    dimensions.push(row.querySelector('.label-dimension').textContent);
                    weights.push(parseFloat(row.querySelector('.input-weight').value) / 100);
                    
                    const sA = row.querySelector('.score-a');
                    const sB = row.querySelector('.score-b');
                    const sC = row.querySelector('.score-c');

                    [sA, sB].forEach(input => {
                        if (input.value === '') { isValid = false; input.classList.add('!border-red-500', '!bg-red-100', 'placeholder-red-400'); }
                    });
                    if (isOptionCVisible && sC.value === '') {
                        isValid = false; sC.classList.add('!border-red-500', '!bg-red-100', 'placeholder-red-400');
                    }

                    scoresA.push(parseFloat(sA.value) || 0);
                    scoresB.push(parseFloat(sB.value) || 0);
                    if (isOptionCVisible) scoresC.push(parseFloat(sC.value) || 0);
                });

                if (!isValid) return;

                const nameA = document.getElementById('name-a').value || '选项 A';
                const nameB = document.getElementById('name-b').value || '选项 B';
                const nameC = document.getElementById('name-c').value || '选项 C';

                let totalA = 0, totalB = 0, totalC = 0;
                for (let i = 0; i < 3; i++) {
                    totalA += scoresA[i] * weights[i];
                    totalB += scoresB[i] * weights[i];
                    if (isOptionCVisible) totalC += scoresC[i] * weights[i];
                }

                document.getElementById('chart-placeholder').classList.add('hidden');
                const canvas = document.getElementById('radarChart');
                canvas.classList.remove('hidden');

                if (myRadarChart) myRadarChart.destroy();

                const datasets = [
                    {
                        label: nameA,
                        data: scoresA,
                        backgroundColor: 'rgba(255, 51, 102, 0.4)',
                        borderColor: '#FF3366',
                        borderWidth: 3,
                        pointBackgroundColor: '#FF3366',
                        pointBorderColor: '#000',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                    },
                    {
                        label: nameB,
                        data: scoresB,
                        backgroundColor: 'rgba(0, 255, 255, 0.4)',
                        borderColor: '#00FFFF',
                        borderWidth: 3,
                        pointBackgroundColor: '#00FFFF',
                        pointBorderColor: '#000',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                    }
                ];

                if (isOptionCVisible) {
                    datasets.push({
                        label: nameC,
                        data: scoresC,
                        backgroundColor: 'rgba(204, 255, 0, 0.4)',
                        borderColor: '#CCFF00',
                        borderWidth: 3,
                        pointBackgroundColor: '#CCFF00',
                        pointBorderColor: '#000',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                    });
                }

                // 修复 3：配合 CSS 的 1.15 倍缩放，在 JS 中给顶部加一点 padding 把图例推回框内
                myRadarChart = new Chart(canvas, {
                    type: 'radar',
                    data: { labels: dimensions, datasets: datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: {
                            // 顶部留出 24px 空间，防止放大后图例被切掉
                            padding: { top: 24, bottom: 0, left: 45, right: 0} 
                        },
                        scales: {
                            r: {
                                min: 0,
                                max: 10,
                                ticks: { display: false }, 
                                pointLabels: { 
                                    padding: 0, 
                                    font: { size: 15, weight: '900', family: 'Inter' }, 
                                    color: '#000' 
                                },
                                grid: { color: '#000', borderDash: [5, 5], lineWidth: 1.5 },
                                angleLines: { color: '#000', borderDash: [5, 5], lineWidth: 1.5 }
                            }
                        },
                        plugins: {
                            legend: { 
                                position: 'top', 
                                align: 'start', 
                                labels: { 
                                    boxWidth: 16, // 图例方块
                                    font: { family: 'Inter', size: 14, weight: 'bold' }, // 图例文字
                                    padding: 15 
                                } 
                            }
                        }
                    }
                });

                const results = [
                    { name: nameA, score: totalA },
                    { name: nameB, score: totalB }
                ];
                if (isOptionCVisible) results.push({ name: nameC, score: totalC });

                results.sort((a, b) => b.score - a.score);

                const winner = results[0];
                const runnerUp = results[1];
                const diff = Math.abs(winner.score - runnerUp.score);

                const greenSubText = document.getElementById('result-sub-text');
                const greenWinnerText = document.getElementById('result-winner-text');
                const yellowNoteText = document.getElementById('yellow-note-text');

                if (diff >= 0.8) {
                    greenSubText.textContent = '综合得分建议';
                    greenWinnerText.innerHTML = `🏆 毫无悬念！<span class="text-indigo-600">${winner.name}</span> 以 ${diff.toFixed(1)} 分绝对优势碾压！`;
                    yellowNoteText.innerHTML = '这波稳啦！<br>关掉页面，现在立刻去下单吧！🛒';
                } else if (diff >= 0.3 && diff < 0.8) {
                    greenSubText.textContent = '综合得分建议';
                    greenWinnerText.innerHTML = `🏆 听数据的！最终赢家：<span class="text-indigo-600">${winner.name}</span>（总分：${winner.score.toFixed(1)}）`;
                    yellowNoteText.innerHTML = '心选商品！<br>就选它，绝对不亏！';
                } else {
                    greenSubText.textContent = '综合得分建议';
                    greenWinnerText.innerHTML = `⚖️ 难分伯仲！<span class="text-indigo-600">${winner.name}</span> 险胜（总分：${winner.score.toFixed(1)}）`;
                    yellowNoteText.innerHTML = '“抛硬币决定的瞬间，<br>你心里已经有答案了。🪙”';
                }
                
            });

            function resetAll() {
                if(weightInputs[0]) weightInputs[0].value = 30;
                if(weightInputs[1]) weightInputs[1].value = 40;
                if(weightInputs[2]) weightInputs[2].value = 30;

                scoreInputs.forEach(input => {
                    input.value = '';
                    input.classList.remove('!border-red-500', '!bg-red-100', 'placeholder-red-400');
                });
                document.querySelectorAll('.input-option-name').forEach(input => input.value = '');

                if (isOptionCVisible) btnToggleC.click();
                
                document.getElementById('chart-placeholder').classList.remove('hidden');
                document.getElementById('radarChart').classList.add('hidden');
                if (myRadarChart) { myRadarChart.destroy(); myRadarChart = null; }

                document.getElementById('result-winner-text').textContent = '等待计算...';
                document.getElementById('result-sub-text').textContent = '综合得分建议';
                document.getElementById('yellow-note-text').innerHTML = '拯救内耗倒计时...<br>快在左边输入数据吧！🐱';

                switchScene('1');
                calculateWeight();
            }

            btnResets.forEach(btn => btn.addEventListener('click', resetAll));

            const row4 = document.getElementById('dimension-row-4');
            if(row4) row4.classList.add('hidden');
            switchScene('1');
            calculateWeight();
        });
    </script>
</body>
